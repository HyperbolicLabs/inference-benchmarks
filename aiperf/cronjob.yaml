# Two CronJobs run sequentially (staggered) so both endpoints are benchmarked without
# doubling load. api.hyperbolic.xyz at :00,:20,:40; inference.hyperbolic.ai at :10,:30,:50.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aiperf-benchmark-api
  namespace: inference-benchmark
  labels:
    app: aiperf
    component: benchmark
    endpoint: api.hyperbolic.xyz
spec:
  schedule: "0,20,40 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: aiperf
            component: benchmark
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-image-pull-secret
          containers:
            - name: aiperf
              image: ghcr.io/hyperboliclabs/aiperf:latest
              imagePullPolicy: Always
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "=== Running AIPerf Benchmark (api.hyperbolic.xyz) ==="
                  python3 /scripts/benchmark.py
                  echo "=== Benchmark Complete ==="
                  ls -lh /tmp/results/ || echo "No results directory"
              env:
                - name: MODEL_NAME
                  value: "Qwen/Qwen3-VL-32B-Thinking"
                - name: ENDPOINT_URL
                  value: "https://api.hyperbolic.xyz"
                - name: ENDPOINT_TYPE
                  value: "chat"
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: hyperbolic-api-key
                      key: api-key
                      optional: true
                - name: CF_ACCESS_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: cloudflare-access-credentials
                      key: client-id
                      optional: true
                - name: CF_ACCESS_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: cloudflare-access-credentials
                      key: client-secret
                      optional: true
                - name: CONCURRENCY
                  value: "10"
                - name: BENCHMARK_DURATION
                  value: "480"
                - name: BENCHMARK_GRACE_PERIOD
                  value: "30"
                - name: REQUEST_TIMEOUT
                  value: "60"
                - name: OUTPUT_TOKENS_MEAN
                  value: "50"
                - name: REQUEST_COUNT
                  value: "10000"
                - name: STREAMING
                  value: "true"
                - name: OUTPUT_DIR
                  value: "/tmp/results"
                - name: TERM
                  value: "dumb"
                - name: CI
                  value: "true"
                - name: NO_COLOR
                  value: "1"
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT
                  value: "600.0"
                - name: AIPERF_SERVICE_PROFILE_START_TIMEOUT
                  value: "300.0"
                - name: AIPERF_DATASET_CONFIGURATION_TIMEOUT
                  value: "600.0"
                - name: DD_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: datadog-api-key
                      key: api-key
                      optional: true
                - name: DD_SITE
                  value: "us5.datadoghq.com"
              volumeMounts:
                - name: results
                  mountPath: /tmp/results
              resources:
                requests:
                  memory: "2Gi"
                  cpu: "200m"
                limits:
                  memory: "4Gi"
                  cpu: "1000m"
          volumes:
            - name: results
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aiperf-benchmark-inference
  namespace: inference-benchmark
  labels:
    app: aiperf
    component: benchmark
    endpoint: inference.hyperbolic.ai
spec:
  schedule: "10,30,50 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: aiperf
            component: benchmark
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-image-pull-secret
          containers:
            - name: aiperf
              image: ghcr.io/hyperboliclabs/aiperf:latest
              imagePullPolicy: Always
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "=== Running AIPerf Benchmark (inference.hyperbolic.ai) ==="
                  python3 /scripts/benchmark.py
                  echo "=== Benchmark Complete ==="
                  ls -lh /tmp/results/ || echo "No results directory"
              env:
                - name: MODEL_NAME
                  value: "Qwen/Qwen3-VL-32B-Thinking"
                - name: ENDPOINT_URL
                  value: "https://inference.hyperbolic.ai"
                - name: ENDPOINT_TYPE
                  value: "chat"
                # inference.hyperbolic.ai uses Cloudflare Access (no OPENAI_API_KEY)
                - name: CF_ACCESS_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: cloudflare-access-credentials
                      key: client-id
                - name: CF_ACCESS_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: cloudflare-access-credentials
                      key: client-secret
                - name: CONCURRENCY
                  value: "10"
                - name: BENCHMARK_DURATION
                  value: "480"
                - name: BENCHMARK_GRACE_PERIOD
                  value: "30"
                - name: REQUEST_TIMEOUT
                  value: "60"
                - name: OUTPUT_TOKENS_MEAN
                  value: "50"
                - name: REQUEST_COUNT
                  value: "10000"
                - name: STREAMING
                  value: "true"
                - name: OUTPUT_DIR
                  value: "/tmp/results"
                - name: TERM
                  value: "dumb"
                - name: CI
                  value: "true"
                - name: NO_COLOR
                  value: "1"
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT
                  value: "600.0"
                - name: AIPERF_SERVICE_PROFILE_START_TIMEOUT
                  value: "300.0"
                - name: AIPERF_DATASET_CONFIGURATION_TIMEOUT
                  value: "600.0"
                - name: DD_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: datadog-api-key
                      key: api-key
                      optional: true
                - name: DD_SITE
                  value: "us5.datadoghq.com"
              volumeMounts:
                - name: results
                  mountPath: /tmp/results
              resources:
                requests:
                  memory: "2Gi"
                  cpu: "200m"
                limits:
                  memory: "4Gi"
                  cpu: "1000m"
          volumes:
            - name: results
              emptyDir: {}
